apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: healthcare
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: healthcare-auth-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SERVER_PORT
          value: "8081"
        - name: MONGODB_URI
          value: "mongodb://admin:admin123@mongodb-service:27017/auth_service?authSource=admin"
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://admin:admin123@mongodb-service:27017/auth_service?authSource=admin"
        - name: SPRING_MONGODB_URI
          value: "mongodb://admin:admin123@mongodb-service:27017/auth_service?authSource=admin"
        - name: JWT_SECRET
          value: "replace-with-a-strong-secret-key-for-dev-only"
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: healthcare
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
  - name: http
    port: 5001
    targetPort: 8081
    nodePort: 30011


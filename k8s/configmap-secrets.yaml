apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
  labels:
    name: healthcare
    managed-by: platform
    environment: kubernetes

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: healthcare
  labels:
    app: payment-service
data:
  PAYMENT_SUCCESS_URL: "http://localhost:3000/payment/success"
  PAYMENT_FAILURE_URL: "http://localhost:3000/payment/failure"
  spring.application.name: "payment-service"
  server.port: "8004"
  spring.data.mongodb.database: "healthcare_payments"
  payment.default-currency: "USD"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secrets
  namespace: healthcare
  labels:
    app: payment-service
type: Opaque
stringData:
  api-key: "sk_test_YOUR_API_KEY_HERE"
  publishable-key: "pk_test_YOUR_PUBLISHABLE_KEY_HERE"
  webhook-secret: "whsec_YOUR_WEBHOOK_SECRET_HERE"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: healthcare
  labels:
    app: mongodb
type: Opaque
stringData:
  password: "admin123"
  uri: "mongodb://admin:admin123@mongodb-service:27017/healthcare_payments?authSource=admin"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service-network-policy
  namespace: healthcare
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: healthcare
    ports:
    - protocol: TCP
      port: 8004
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8004
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: healthcare
    ports:
    - protocol: TCP
      port: 27017
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: healthcare
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-service

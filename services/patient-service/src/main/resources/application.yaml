spring:
  application:
    name: patient-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/healthcare_patient}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5173
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

file:
  upload-dir: uploads/

server:
  port: 8082

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sliit.healthcare.patient: DEBUG
    org.springframework.web: INFO

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJwtSigningWhichIsAtLeast32Characters}
  expiration: 3600000

# Local convenience toggle to disable JWT security during local development/testing
app:
  security:
    enabled: false
  file:
    storage:
      path: ${FILE_STORAGE_PATH:uploads/medical-reports}
      max-size: ${FILE_MAX_SIZE:10485760} # 10MB in bytes
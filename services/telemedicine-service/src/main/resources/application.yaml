spring:
  application:
    name: telemedicine-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/healthcare_telemedicine}
      database: ${SPRING_MONGODB_DATABASE:healthcare_telemedicine}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8085}

jwt:
  issuer: healthcare-platform
  secret: ${JWT_SECRET:replace-with-a-strong-secret-key-for-dev-only}

jitsi:
  api-url: ${JITSI_API_URL:https://api.jitsi.net}
  api-key: ${JITSI_API_KEY:your-jitsi-api-key}
  app-id: ${JITSI_APP_ID:your-jitsi-app-id}
  private-key: ${JITSI_PRIVATE_KEY:your-jitsi-private-key}
  conference-duration-seconds: ${JITSI_CONFERENCE_DURATION:3600}

spring:
  application:
    name: doctor-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/healthcare_doctor}
      database: ${SPRING_MONGODB_DATABASE:healthcare_doctor}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8083}

jwt:
  issuer: healthcare-platform
  secret: ${JWT_SECRET:replace-with-a-strong-secret-key-for-dev-only}

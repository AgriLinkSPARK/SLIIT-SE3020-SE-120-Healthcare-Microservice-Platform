services:
  mongodb:
    image: mongo:7.0
    container_name: healthcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/healthcare_payments
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/healthcare_payments
      SPRING_MONGODB_DATABASE: healthcare_payments
      SPRING_MONGODB_URI_ATLAS: mongodb+srv://aenuine_db_user:jPKz61Zhk5qQkWE3@cluster0.pgglpoh.mongodb.net/?appName=Cluster0&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=3000
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
    container_name: healthcare-appointment-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8002
      SPRING_MONGODB_URI: mongodb://mongodb:27017/healthcare_appointments
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/healthcare_appointments
      SPRING_MONGODB_DATABASE: healthcare_appointments
      SPRING_MONGODB_URI_ATLAS: mongodb+srv://aenuine_db_user:1UGbqsYcQDXx1doi@cluster0.x7dnyc7.mongodb.net/?appName=Cluster0
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/appointments/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: healthcare-auth-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: mongodb+srv://chamithu_db_user:wVyYgnFqzCAK6WZO@cluster0.pygjnpf.mongodb.net/auth_service?appName=Cluster0
      SPRING_DATA_MONGODB_URI: mongodb+srv://chamithu_db_user:wVyYgnFqzCAK6WZO@cluster0.pygjnpf.mongodb.net/auth_service?appName=Cluster0
      SPRING_MONGODB_URI: mongodb+srv://chamithu_db_user:wVyYgnFqzCAK6WZO@cluster0.pygjnpf.mongodb.net/auth_service?appName=Cluster0
      JWT_SECRET: replace-with-a-strong-prod-secret
      JWT_EXPIRATION_MINUTES: 120
      AUTH_SEED_ADMIN_ENABLED: "true"
      AUTH_ADMIN_FULL_NAME: Platform Administrator
      AUTH_ADMIN_EMAIL: admin@healthcare.local
      AUTH_ADMIN_PASSWORD: Admin@123456
    ports:
      - "8081:8081"

  doctor-service:
    build:
      context: ./services/doctor-service
      dockerfile: Dockerfile
    container_name: healthcare-doctor-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      MONGODB_URI: mongodb://mongodb:27017/healthcare_doctor
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/healthcare_doctor
      SPRING_MONGODB_URI: mongodb://mongodb:27017/healthcare_doctor
      MONGODB_URI_ATLAS: mongodb+srv://chamithued_db_user:65SBkoG0ZUmw2fKG@cluster0.m8gi3fh.mongodb.net/healthcare_doctor?appName=Cluster0
      JWT_SECRET: replace-with-a-strong-prod-secret
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8081/api}
        VITE_DOCTOR_SERVICE_URL: ${VITE_DOCTOR_SERVICE_URL:-http://localhost:8083}
        VITE_PAYMENT_SERVICE_URL: ${VITE_PAYMENT_SERVICE_URL:-http://localhost:8004}
        VITE_APPOINTMENT_SERVICE_URL: ${VITE_APPOINTMENT_SERVICE_URL:-http://localhost:8002/api/v1/appointments}
        VITE_TELEMEDICINE_SERVICE_URL: ${VITE_TELEMEDICINE_SERVICE_URL:-/api/telemedicine/sessions}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: healthcare-frontend
    depends_on:
      auth-service:
        condition: service_started
      doctor-service:
        condition: service_started
      payment-service:
        condition: service_healthy
      appointment-service:
        condition: service_started
      telemedicine-service:
        condition: service_started
    ports:
      - "3000:80"

  telemedicine-service:
    build:
      context: ./services/telemedicine-service
      dockerfile: Dockerfile
    container_name: healthcare-telemedicine-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      MONGODB_URI: mongodb://mongodb:27017/healthcare_telemedicine
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/healthcare_telemedicine
      SPRING_MONGODB_URI: mongodb://mongodb:27017/healthcare_telemedicine
      JWT_SECRET: replace-with-a-strong-prod-secret
